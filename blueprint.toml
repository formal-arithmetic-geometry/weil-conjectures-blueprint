# Settings for the blueprint tool. See docs/cli.md in chrisflav/blueprint.

[project]
name = "weil-conjectures"
title = "Weil Conjectures"
dir = "blueprint"

[lean]
modules = ["WeilConjectures"]

[site]
theme = "outline"        # the style the website opens in
numbering = "nested"     # a statement inside a statement is numbered under it: 2.3.1, 2.3.2, …
assets = "site-assets"   # copied into the site as assets/
blog = "blog"            # posts, Markdown and PDFs, on the Blog page
logo = "assets/R1b-W-mirror-sigma-ink.svg"   # left of the title in the top bar
logoInk = false          # its own colours: black, and light grey in dark mode (the SVG says so)
docgen = "https://formal-arithmetic-geometry.github.io/weil-conjectures/"   # doc-gen4 documentation; Lean names link to their pages
pdfScopes = ["part", "chapter", "appendix", "chap-Introduction"]   # PDFs of the whole, each part, each chapter (appendices too) and the introduction; no section, not the references
pdfDetails = false       # PDFs hold the sketch only: no declaration inside another, nor what is below it
pdfReferences = "all"    # every PDF ends with the whole bibliography, on a new page
visitors = true          # count the visitors (by browser, through the comment server) and show the number on the Progress page

# Comments go to Zulip, one topic per object; public ones are also shown below
# the page. The bot comes from BLUEPRINT_ZULIP_EMAIL and BLUEPRINT_ZULIP_KEY
# when the site is built: the site workflow sets them from the repository's
# secrets, and for a local `lake exe blueprint serve` you export them yourself.
# Without them the site keeps its comments with the comment server of `serve`.
[site.comments]
zulip   = "https://weil.zulip.merten.dev"
channel = "Blueprint Comments"

# The opening film: the title is written by hand over a faded letter, wiped
# down to its W, which turns into the logo; the logo flies onto the top bar's,
# and the view zooms through the pictures below into the graph.  intro.md is
# written by scripts/intro_title.py.  See [site.intro] in docs/cli.md of the
# blueprint tool.
[site.intro]
file = "intro.md"                        # the title, an animated SVG
background = "assets/deligne-letter-1969.jpg"   # Deligne to Weil, 1 July 1969 (see site-assets/CREDITS.md)
hold = 5.35                              # writing 1.6, still 0.6, wiping 2 x 0.8, the W 0.8, the mirror 0.75 s
step = [1.2, 1.8, 1.8]                   # seconds per step of the zoom, at one speed

[[site.intro.zoom]]
nodes = ["Weil Conjecture"]

[[site.intro.zoom]]
nodes = [
  { id = "pre", title = "Preliminaries" },
  { id = "six", title = "Part I: The six operations" },
  { id = "trace", title = "Part II: Duality and the trace formula" },
  { id = "weight", title = "Part III: Weights and the Riemann hypothesis" },
]
arrows = [["pre", "six"], ["six", "trace"], ["trace", "weight"], ["pre", "weight"]]

# `name_showing = false` marks a statement whose title was made up for the
# blueprint because the tex gives it none; the tool only needs to accept it.
[kinds.theorem]
attrs = ["title", "lean", "review", "tags", "order", "aliases", "owner", "name_showing"]

[kinds.lemma]
attrs = ["title", "lean", "review", "tags", "order", "aliases", "owner", "name_showing"]

[kinds.proposition]
attrs = ["title", "lean", "review", "tags", "order", "aliases", "owner", "name_showing"]

[kinds.corollary]
attrs = ["title", "lean", "review", "tags", "order", "aliases", "owner", "name_showing"]

[kinds.definition]
attrs = ["title", "lean", "review", "tags", "order", "aliases", "owner", "name_showing"]

[kinds.remark]
attrs = ["title", "lean", "review", "tags", "order", "aliases", "owner", "name_showing"]

[kinds.question]
attrs = ["title", "lean", "review", "tags", "order", "aliases", "owner", "name_showing"]

[kinds.example]
attrs = ["title", "lean", "review", "tags", "order", "aliases", "owner", "name_showing"]

