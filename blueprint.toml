# Settings for the blueprint tool. See docs/cli.md in chrisflav/blueprint.

[project]
name = "weil-conjectures"
title = "The Weil conjectures"
dir = "blueprint"

[lean]
modules = ["WeilConjectures"]

[katex.macros]
"\\Ab" = "\\mathsf{Ab}"
"\\AffSch" = "\\operatorname{AffSch}"
"\\Dplus" = "D^+"
"\\Et" = "\\mathrm{et}"
"\\Ex" = "\\operatorname{Ex}"
"\\Fbar" = "\\overline{\\mathbf F}_q"
"\\Fq" = "\\mathbf F_q"
"\\Gal" = "\\operatorname{Gal}"
"\\Hens" = "\\operatorname{Hens}"
"\\Hom" = "\\ensuremath{\\operatorname{Hom}}"
"\\Kar" = "\\operatorname{Kar}"
"\\N" = "\\mathbb{N}"
"\\Needspace" = "\\par"
"\\O" = "{\\mathcal{O}}"
"\\ProFin" = "\\operatorname{ProFin}"
"\\Qbar" = "\\overline{\\mathbf Q}"
"\\Qbarl" = "\\overline{\\mathbf Q}_{\\ell}"
"\\Qell" = "\\mathbf{Q}_{\\ell}"
"\\Ql" = "\\mathbf Q_{\\ell}"
"\\Qlb" = "\\overline{\\mathbf Q}_\\ell"
"\\R" = "\\mathbb{R}"
"\\RGamma" = "R\\Gamma"
"\\RGammac" = "R\\Gamma_c"
"\\Rat" = "\\operatorname{IsRat}"
"\\Sh" = "\\operatorname{Sh}"
"\\Span" = "\\operatorname{span}"
"\\Spec" = "\\operatorname{Spec}"
"\\Tr" = "\\operatorname{Tr}"
"\\Wt" = "\\operatorname{Wt}"
"\\Z" = "\\mathbb{Z}"
"\\Zell" = "\\mathbf{Z}_{\\ell}"
"\\Zl" = "\\mathbf Z_\\ell"
"\\affet" = "\\ensuremath{#1^{\\mathrm{aff}}_{\\mathrm{ét}}}"
"\\affproet" = "\\ensuremath{#1^{\\mathrm{aff}}_{\\mathrm{proét}}}"
"\\checked" = "\\color{red}\\aftergroup\\restorecolor"
"\\coeff" = "\\operatorname{coeff}"
"\\colim" = "\\ensuremath{\\operatorname{colim}}"
"\\constructedby" = "\\par\\smallskip\\noindent\\textcolor{purple!60!black}{\\textsf{Constructed by:} }\n  \\footnotesize\\sloppy\\nolinkurl{#1}\\par"
"\\deepresult" = "\\par\\smallskip\\noindent\\textcolor{orange!45!black}{\n  \\textsf{Blueprint role: named deep theorem node; see the cluster proof architecture.}}\n  \\par\\noindent\\textcolor{orange!45!black}{\\textsf{Mathematical source:} }#1\\par"
"\\et" = "\\ensuremath{#1_{\\mathrm{ét}}}"
"\\formalizationnote" = "\\begin{quote}\\small\\raggedright\\textbf{Formalization note.} #1\\end{quote}"
"\\fpqc" = "\\ensuremath{X_{\\mathrm{fpqc}}}"
"\\gammacont" = "\\ensuremath{\\Gamma_{\\mathrm{cont}}}"
"\\m" = "{\\mathfrak{m}}"
"\\n" = "{\\mathfrak{n}}"
"\\nagataGap" = "\\par\\noindent\\textbf{Formalization gap.} #1\\par"
"\\openobligation" = "\\par\\smallskip\\noindent\\textcolor{red!65!black}{\\textsf{Open obligation:} }\n  \\footnotesize\\sloppy\\nolinkurl{#1}\\par"
"\\p" = "{\\mathfrak{p}}"
"\\preshv" = "\\ensuremath{\\mathrm{PreShv}(#1)}"
"\\pro" = "\\ensuremath{\\mathrm{Pro}(#1)}"
"\\proet" = "\\ensuremath{X_{\\mathrm{proét}}}"
"\\q" = "{\\mathfrak{q}}"
"\\rank" = "\\operatorname{rank}"
"\\red" = "\\color{red}"
"\\restorecolor" = "\\color{black}"
"\\retiredobligation" = "\\par\\smallskip\\noindent\\textcolor{red!75!black}{\\textsf{Retired invalid route:} }\n  \\footnotesize\\sloppy\\nolinkurl{#1}\\par"
"\\sep" = "\\textnormal{sep}"
"\\shv" = "\\ensuremath{\\mathrm{Shv}(#1)}"
"\\spec" = "\\ensuremath{\\mathrm{Spec}(#1)}"
"\\stacksproject" = "{\\cite[\\href{https://stacks.math.columbia.edu/tag/#1}{Tag #1}]{stacks-project}}"
"\\statusnote" = "\\begin{quote}\\small\\raggedright\\textbf{Status.} #1\\end{quote}"
"\\tildeideal" = "\\ensuremath{\\widetilde{(#1, #2)}}"
"\\tildering" = "\\ensuremath{#1_{\\widetilde{(#2, #3)}}}"
