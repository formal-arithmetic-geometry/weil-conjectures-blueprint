# The blueprint of the Weil conjectures project, as a Lake package.
#
# Nothing here is compiled. The package exists so that `lake exe blueprint` and
# the project's oleans are both available from one directory: the blueprint tool
# is built by Lake with the same toolchain as the project, which is what lets
# `blueprint extract` import the project's modules and derive proof status from
# them. Bump `rev` on weil-conjectures to move the blueprint to a newer state of
# the formalisation; the tool is the copy in `blueprint-tool/`.
name = "weil-conjectures-blueprint"
version = "0.1.0"
defaultTargets = []

# The blueprint tool, vendored from https://github.com/chrisflav/blueprint
# (12dff24) so that it can carry local fixes: its dependency walk stays inside
# the project (chrisflav/blueprint#1).
[[require]]
name = "blueprint"
path = "blueprint-tool"

[[require]]
name = "weil-conjectures"
git = "https://github.com/formal-arithmetic-geometry/weil-conjectures"
# The branch the blueprint was written against: it names declarations (the Nagata
# compactification, the Chow lemma, the Segre embedding) that master does not
# carry yet. Move this to "master" once that work has landed there.
rev = "slopmaster"
